<!--
  Mockup ilustrativo de uma "landing page" (layout centralizado, foco em
  conversão). Mesma paleta dos outros mockups do carrossel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustração de uma landing page">
  <rect width="960" height="600" rx="20" fill="#16233A"/>

  <circle cx="40" cy="40" r="6" fill="#2A80B9"/>
  <circle cx="60" cy="40" r="6" fill="#2A80B9"/>
  <circle cx="80" cy="40" r="6" fill="#2A80B9"/>
  <rect x="110" y="30" width="500" height="20" rx="6" fill="#111E30"/>

  <rect x="32" y="70" width="896" height="498" rx="12" fill="#1C2833"/>

  <g stroke="#48C9B0" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M60 100 H160 L190 130 V220"/>
    <path d="M900 500 H760 L730 470 H560"/>
    <circle cx="190" cy="220" r="4" fill="#48C9B0" stroke="none"/>
    <circle cx="560" cy="470" r="4" fill="#48C9B0" stroke="none"/>
  </g>

  <!-- logo central pequeno -->
  <rect x="440" y="104" width="80" height="16" rx="4" fill="#48C9B0"/>

  <!-- headline central -->
  <rect x="255" y="160" width="450" height="30" rx="6" fill="#ECF0F1"/>
  <rect x="305" y="200" width="350" height="30" rx="6" fill="#ECF0F1"/>
  <rect x="330" y="250" width="300" height="14" rx="4" fill="rgba(236,240,241,0.45)"/>
  <rect x="360" y="270" width="240" height="14" rx="4" fill="rgba(236,240,241,0.45)"/>

  <!-- CTA grande centralizado -->
  <rect x="400" y="312" width="160" height="46" rx="8" fill="#00D2FF"/>

  <!-- indicador de confiança -->
  <rect x="380" y="376" width="200" height="12" rx="4" fill="rgba(236,240,241,0.3)"/>

  <!-- três blocos de benefício -->
  <g>
    <rect x="120" y="430" width="220" height="110" rx="10" fill="#111E30"/>
    <circle cx="230" cy="466" r="20" fill="#00D2FF"/>
    <rect x="150" y="500" width="160" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>

    <rect x="370" y="430" width="220" height="110" rx="10" fill="#111E30"/>
    <circle cx="480" cy="466" r="20" fill="#2A80B9"/>
    <rect x="400" y="500" width="160" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>

    <rect x="620" y="430" width="220" height="110" rx="10" fill="#111E30"/>
    <circle cx="730" cy="466" r="20" fill="#48C9B0"/>
    <rect x="650" y="500" width="160" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>
  </g>
</svg>
