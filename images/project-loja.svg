<!--
  Mockup ilustrativo de uma "loja virtual" (grade de produtos). Mesma
  paleta dos outros mockups do carrossel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustração de uma loja virtual">
  <rect width="960" height="600" rx="20" fill="#16233A"/>

  <circle cx="40" cy="40" r="6" fill="#2A80B9"/>
  <circle cx="60" cy="40" r="6" fill="#2A80B9"/>
  <circle cx="80" cy="40" r="6" fill="#2A80B9"/>
  <rect x="110" y="30" width="500" height="20" rx="6" fill="#111E30"/>

  <rect x="32" y="70" width="896" height="498" rx="12" fill="#111E30"/>

  <!-- barra superior com busca -->
  <rect x="72" y="100" width="90" height="16" rx="4" fill="#48C9B0"/>
  <rect x="400" y="96" width="300" height="26" rx="13" fill="#1C2833"/>
  <rect x="780" y="96" width="80" height="26" rx="6" fill="#00D2FF"/>

  <g stroke="#48C9B0" stroke-width="1.5" opacity="0.2" fill="none">
    <path d="M32 300 H90 L115 275 H200"/>
    <circle cx="200" cy="275" r="4" fill="#48C9B0" stroke="none"/>
  </g>

  <!-- grade de produtos: 3 colunas x 2 linhas -->
  <g>
    <!-- linha 1 -->
    <rect x="72" y="150" width="248" height="190" rx="10" fill="#1C2833"/>
    <rect x="88" y="166" width="216" height="120" rx="8" fill="#2A80B9" opacity="0.55"/>
    <rect x="88" y="298" width="150" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>
    <rect x="88" y="318" width="70" height="14" rx="4" fill="#00D2FF"/>

    <rect x="356" y="150" width="248" height="190" rx="10" fill="#1C2833"/>
    <rect x="372" y="166" width="216" height="120" rx="8" fill="#00D2FF" opacity="0.5"/>
    <rect x="372" y="298" width="150" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>
    <rect x="372" y="318" width="70" height="14" rx="4" fill="#00D2FF"/>

    <rect x="640" y="150" width="248" height="190" rx="10" fill="#1C2833"/>
    <rect x="656" y="166" width="216" height="120" rx="8" fill="#48C9B0" opacity="0.5"/>
    <rect x="656" y="298" width="150" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>
    <rect x="656" y="318" width="70" height="14" rx="4" fill="#00D2FF"/>

    <!-- linha 2 -->
    <rect x="72" y="360" width="248" height="190" rx="10" fill="#1C2833"/>
    <rect x="88" y="376" width="216" height="120" rx="8" fill="#00D2FF" opacity="0.5"/>
    <rect x="88" y="508" width="150" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>
    <rect x="88" y="528" width="70" height="14" rx="4" fill="#00D2FF"/>

    <rect x="356" y="360" width="248" height="190" rx="10" fill="#1C2833"/>
    <rect x="372" y="376" width="216" height="120" rx="8" fill="#2A80B9" opacity="0.55"/>
    <rect x="372" y="508" width="150" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>
    <rect x="372" y="528" width="70" height="14" rx="4" fill="#00D2FF"/>

    <rect x="640" y="360" width="248" height="190" rx="10" fill="#1C2833"/>
    <rect x="656" y="376" width="216" height="120" rx="8" fill="#48C9B0" opacity="0.5"/>
    <rect x="656" y="508" width="150" height="12" rx="4" fill="rgba(236,240,241,0.5)"/>
    <rect x="656" y="528" width="70" height="14" rx="4" fill="#00D2FF"/>
  </g>
</svg>
