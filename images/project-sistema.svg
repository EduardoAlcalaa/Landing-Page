<!--
  Mockup ilustrativo de um "painel de sistema" (dashboard com menu lateral,
  cartões de indicadores e um gráfico). Mesma paleta dos outros mockups.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustração de um painel de sistema (dashboard)">
  <rect width="960" height="600" rx="20" fill="#16233A"/>

  <circle cx="40" cy="40" r="6" fill="#2A80B9"/>
  <circle cx="60" cy="40" r="6" fill="#2A80B9"/>
  <circle cx="80" cy="40" r="6" fill="#2A80B9"/>
  <rect x="110" y="30" width="500" height="20" rx="6" fill="#111E30"/>

  <rect x="32" y="70" width="896" height="498" rx="12" fill="#111E30"/>

  <!-- menu lateral -->
  <rect x="32" y="70" width="200" height="498" rx="12" fill="#1C2833"/>
  <rect x="56" y="100" width="70" height="16" rx="4" fill="#48C9B0"/>
  <rect x="56" y="160" width="150" height="30" rx="6" fill="#00D2FF" opacity="0.9"/>
  <rect x="56" y="204" width="150" height="14" rx="4" fill="rgba(236,240,241,0.4)"/>
  <rect x="56" y="234" width="150" height="14" rx="4" fill="rgba(236,240,241,0.4)"/>
  <rect x="56" y="264" width="150" height="14" rx="4" fill="rgba(236,240,241,0.4)"/>
  <rect x="56" y="294" width="150" height="14" rx="4" fill="rgba(236,240,241,0.4)"/>

  <g stroke="#00D2FF" stroke-width="1.5" opacity="0.2" fill="none">
    <path d="M260 470 H340 L365 445 H520"/>
    <circle cx="520" cy="445" r="4" fill="#00D2FF" stroke="none"/>
  </g>

  <!-- topo do conteúdo -->
  <rect x="264" y="100" width="200" height="22" rx="6" fill="#ECF0F1"/>
  <rect x="760" y="100" width="100" height="34" rx="8" fill="#00D2FF"/>

  <!-- cartões de indicadores -->
  <g>
    <rect x="264" y="150" width="185" height="90" rx="10" fill="#1C2833"/>
    <rect x="286" y="172" width="80" height="12" rx="4" fill="rgba(236,240,241,0.4)"/>
    <rect x="286" y="196" width="60" height="22" rx="4" fill="#00D2FF"/>

    <rect x="466" y="150" width="185" height="90" rx="10" fill="#1C2833"/>
    <rect x="488" y="172" width="80" height="12" rx="4" fill="rgba(236,240,241,0.4)"/>
    <rect x="488" y="196" width="60" height="22" rx="4" fill="#48C9B0"/>

    <rect x="668" y="150" width="192" height="90" rx="10" fill="#1C2833"/>
    <rect x="690" y="172" width="80" height="12" rx="4" fill="rgba(236,240,241,0.4)"/>
    <rect x="690" y="196" width="60" height="22" rx="4" fill="#2A80B9"/>
  </g>

  <!-- área de gráfico -->
  <rect x="264" y="264" width="596" height="272" rx="10" fill="#1C2833"/>
  <rect x="292" y="288" width="140" height="14" rx="4" fill="rgba(236,240,241,0.4)"/>
  <g>
    <rect x="300" y="440" width="46" height="70" rx="4" fill="#2A80B9"/>
    <rect x="360" y="400" width="46" height="110" rx="4" fill="#00D2FF"/>
    <rect x="420" y="420" width="46" height="90" rx="4" fill="#2A80B9"/>
    <rect x="480" y="360" width="46" height="150" rx="4" fill="#00D2FF"/>
    <rect x="540" y="410" width="46" height="100" rx="4" fill="#2A80B9"/>
    <rect x="600" y="380" width="46" height="130" rx="4" fill="#00D2FF"/>
    <rect x="660" y="430" width="46" height="80" rx="4" fill="#2A80B9"/>
    <rect x="720" y="450" width="46" height="60" rx="4" fill="#48C9B0"/>
    <rect x="780" y="400" width="46" height="110" rx="4" fill="#00D2FF"/>
  </g>
</svg>
